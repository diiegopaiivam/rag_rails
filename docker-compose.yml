x-rails: &rails
  build: .
  env_file: .env
  environment:
    RAILS_ENV: development
    RAILS_LOG_TO_STDOUT: "1"
    DATABASE_URL: postgres://postgres:postgres@db:5432/rag_development
    REDIS_URL: redis://redis:6379/0
  volumes:
    - .:/rails           # código + storage/ (uploads) compartilhados entre web e sidekiq
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:pg16   # Postgres 16 com a extensão vector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag_development
    ports:
      - "5433:5432"                 # 5433 no host para não colidir com um Postgres local
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag_development"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    <<: *rails
    command: bash -c "rm -f tmp/pids/server.pid && bin/rails db:prepare && bin/rails server -b 0.0.0.0"
    ports:
      - "3000:3000"

  sidekiq:
    <<: *rails
    command: bundle exec sidekiq

volumes:
  pgdata:
  redisdata:
